<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現地照片筆記｜安全更新</title><style>body{font:18px/1.65 system-ui,sans-serif;max-width:650px;margin:28px auto;padding:0 20px;background:#f7f7f4;color:#303a34}button,a{font:inherit}button{padding:12px 18px;border:1px solid #87938b;border-radius:9px;background:white;color:inherit}#status{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#344b36}small{display:block}</style><h1>安全更新 App</h1><p>請在原本使用 App 的同一個瀏覽器／入口開啟此頁。不要切換到無痕模式或另一個瀏覽器；主畫面版可能使用不同儲存空間。先完成拍照、上傳或匯出，並確認草稿已儲存，再按更新。</p><p><strong>不清除照片、紀錄集、草稿或操作紀錄。</strong>只更新程式快取；Google 登入可能需要重新操作。不要刪除網站資料或移除主畫面 App。</p><button id="update" type="button">確認已停止操作，安全更新</button><p id="status" role="status" aria-live="polite">尚未更新。</p><p><a id="open" href="./" hidden>開啟更新後的 App</a></p><small>更新工具：20261016-33。此頁不登入 Google，也不讀寫你的文件。</small><script>
const status=document.querySelector('#status'),button=document.querySelector('#update'),openApp=document.querySelector('#open');
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function build(worker){
 if(!worker)return null;
 return new Promise(resolve=>{const channel=new MessageChannel(),timer=setTimeout(()=>{channel.port1.close();resolve(null);},700);channel.port1.onmessage=event=>{clearTimeout(timer);channel.port1.close();resolve(event.data?.cache||null);};try{worker.postMessage({type:'GET_BUILD'},[channel.port2]);}catch{clearTimeout(timer);channel.port1.close();resolve(null);}});
}
const minimumRelease=Math.max(33,Number(new URL(location.href).searchParams.get('release'))||33);
const modern=value=>/^field-photo-notebook-shell-v\d+$/.test(value||'')&&Number(value.match(/v(\d+)$/)[1])>=minimumRelease;
button.onclick=async()=>{
 button.disabled=true;openApp.hidden=true;
 try{
  if(!('serviceWorker' in navigator))throw Error('此瀏覽器無法管理 App 程式快取；請回原本的瀏覽器操作。');
  status.textContent='正在檢查更新並核對整套程式檔案…';
  const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await registration.update();
  const deadline=Date.now()+45000;let selected=null;
  while(Date.now()<deadline){
   const waiting=registration.waiting,active=registration.active;
   const waitingBuild=await build(waiting);
   if(modern(waitingBuild)){selected=waiting;break;}
   const activeBuild=await build(active);
   if(modern(activeBuild)){selected=active;break;}
   if(registration.installing?.state==='redundant')throw Error('下載版本不一致或連線中斷，這次未切換；請稍後再試，原資料保留。');
   await delay(350);
  }
  if(!selected)throw Error('更新尚未完成，可能是網路或伺服器仍在更新。原資料保留，請稍後重試。');
  if(selected===registration.waiting){status.textContent='程式檔案已核對，正在切換新版…';selected.postMessage({type:'ACTIVATE_UPDATE'});}
  const activationDeadline=Date.now()+15000;let version;
  while(Date.now()<activationDeadline){version=await build(navigator.serviceWorker.controller);if(modern(version))break;await delay(250);}
  if(!modern(version))throw Error('尚未確認切換完成，請保留此頁稍後重試；不要清除網站資料。');
  const url=new URL('./',location.href);url.searchParams.set('updated',version);openApp.href=url.href;openApp.hidden=false;
  status.textContent='更新成功：'+version+'。\n請關閉舊的 App 分頁，再由下方連結重開；展開「Word 備份與其他操作」可查看核心版本。原照片、草稿與操作紀錄沒有清除。';
 }catch(error){status.textContent='未確認更新成功：'+error.message;}
 finally{button.disabled=false;}
};
</script></html>
